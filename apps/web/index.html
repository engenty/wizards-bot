<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>wizards.bot</title>
    <script>
      // Before first paint, so a dark page never flashes light (lib/theme.ts keeps it).
      var pick = null;
      try {
        pick = localStorage.getItem("wizards.theme");
      } catch {}
      var mode = ["light", "branded", "dark"].indexOf(pick) >= 0 ? pick
        : matchMedia("(prefers-color-scheme: dark)").matches ? "branded" : "light";
      if (mode !== "light") document.documentElement.classList.add("dark");
      if (mode === "branded") document.documentElement.classList.add("branded");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
