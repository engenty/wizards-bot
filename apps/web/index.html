<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>wizards.bot</title>
    <script>
      // Before first paint, so a page never flashes in the wrong colours (lib/theme.ts keeps it).
      var pick = null;
      var ground = null;
      try {
        pick = localStorage.getItem("wizards.theme");
        ground = localStorage.getItem("wizards.ground");
      } catch {}
      var mode = ["light", "branded", "dark"].indexOf(pick) >= 0 ? pick : "branded";
      if (["cobalt", "violet", "berry", "petrol", "emerald", "brick", "citron"].indexOf(ground) < 0) ground = "petrol";
      var root = document.documentElement;
      if (mode === "dark" || (mode === "branded" && ground !== "citron")) root.classList.add("dark");
      if (mode === "branded") root.classList.add("branded");
      root.dataset.ground = ground;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
